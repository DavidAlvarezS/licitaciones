name: Buscar licitaciones

on:
  schedule:
    - cron: "17 6 * * *"      # cada día a las 06:17 UTC (07:17 en España en invierno)
  workflow_dispatch:           # permite lanzarlo a mano desde la pestaña Actions
  push:                        # se ejecuta al subir cambios al script o a este workflow
    branches: [main]
    paths:
      - buscar_licitaciones.py
      - .github/workflows/licitaciones.yml

permissions:
  contents: write

concurrency:
  group: licitaciones
  cancel-in-progress: true     # una ejecución nueva cancela la anterior si se quedó colgada

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar conexión con la plataforma
        continue-on-error: true
        timeout-minutes: 2
        run: |
          {
            echo "== Prueba de conexión $(date -u +%FT%TZ) =="
            curl -sS -m 40 -o /dev/null -D - "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom" | head -15
          } 2>&1 | tee run.log

      - name: Descargar y filtrar licitaciones
        timeout-minutes: 12
        # Cambia aquí los filtros si quieres (ver opciones en el script)
        run: |
          set -o pipefail
          python buscar_licitaciones.py --max-importe 60000 --cpv 72 --nuts ES11 --paginas 80 --max-minutos 9 --salida licitaciones_filtradas.csv 2>&1 | tee -a run.log

      - name: Guardar el CSV y el registro en el repositorio
        if: always()
        run: |
          mkdir -p /tmp/salida
          cp run.log /tmp/salida/ 2>/dev/null || true
          cp licitaciones_filtradas.csv /tmp/salida/ 2>/dev/null || true
          cp muestra_entradas.csv /tmp/salida/ 2>/dev/null || true
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main      # evita conflictos con otras ejecuciones
            cp /tmp/salida/run.log . 2>/dev/null || true
            cp /tmp/salida/licitaciones_filtradas.csv . 2>/dev/null || true
            cp /tmp/salida/muestra_entradas.csv . 2>/dev/null || true
            git add -f run.log
            [ -f licitaciones_filtradas.csv ] && git add licitaciones_filtradas.csv || true
            [ -f muestra_entradas.csv ] && git add muestra_entradas.csv || true
            git diff --cached --quiet && break
            git commit -m "Actualizar licitaciones y registro $(date -u +%F)"
            git push origin HEAD:main && break
            sleep 5
          done
