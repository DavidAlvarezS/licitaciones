name: Buscar licitaciones

on:
  schedule:
    - cron: "17 6 * * *"      # cada día a las 06:17 UTC (07:17 en España en invierno)
  workflow_dispatch:           # permite lanzarlo a mano desde la pestaña Actions
  push:                        # se ejecuta al subir cambios al script o a este workflow
    branches: [main]
    paths:
      - buscar_licitaciones.py
      - .github/workflows/licitaciones.yml

permissions:
  contents: write

concurrency:
  group: licitaciones
  cancel-in-progress: true     # una ejecución nueva cancela la anterior si se quedó colgada

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar conexión con la plataforma
        continue-on-error: true
        run: |
          {
            echo "== Prueba de conexión $(date -u +%FT%TZ) =="
            curl -sS -m 40 -o /dev/null -D - "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom" | head -15
          } 2>&1 | tee run.log

      - name: Descargar y filtrar licitaciones
        # Cambia aquí los filtros si quieres (ver opciones en el script)
        run: |
          set -o pipefail
          python buscar_licitaciones.py --max-importe 60000 --cpv 72 --nuts ES11 --paginas 80 --salida licitaciones_filtradas.csv 2>&1 | tee -a run.log

      - name: Guardar el CSV y el registro en el repositorio
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f run.log
          [ -f licitaciones_filtradas.csv ] && git add licitaciones_filtradas.csv || true
          git diff --cached --quiet || git commit -m "Actualizar licitaciones y registro $(date -u +%F)"
          git pull --rebase origin main || true
          git push
