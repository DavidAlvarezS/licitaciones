name: Buscar licitaciones

on:
  schedule:
    - cron: "17 6 * * *"      # cada día a las 06:17 UTC (07:17 en España en invierno)
  workflow_dispatch:           # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y filtrar licitaciones
        # Cambia aquí los filtros si quieres (ver opciones en el script)
        run: python buscar_licitaciones.py --max-importe 60000 --cpv 72 --nuts ES11 --paginas 80 --salida licitaciones_filtradas.csv

      - name: Guardar el CSV como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: licitaciones
          path: licitaciones_filtradas.csv

      - name: Guardar el CSV en el repositorio
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add licitaciones_filtradas.csv
          git diff --cached --quiet || git commit -m "Actualizar licitaciones $(date -u +%F)"
          git push
